spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:learning_platform}
    username: ${POSTGRES_USER:learning_platform}
    password: ${POSTGRES_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:learning_platform}
    password: ${RABBITMQ_PASSWORD}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true

messaging:
  payment:
    simulated-outcome: CONFIRMED
  outbox:
    batch-size: 20
    poll-interval: 1s
    confirm-timeout: 5s

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-components: always
      show-details: never

security:
  jwt:
    secret: ${JWT_SECRET}
    issuer: event-driven-learning-platform
    ttl: ${JWT_TTL:PT1H}
